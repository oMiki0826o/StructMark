name: Deploy StructMark site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/site/package-lock.json
      - name: Install language core
        run: npm ci
      - name: Test language core
        run: npm test
      - name: Fuzz language core
        run: npm run fuzz
      - name: Verify bilingual syntax documents
        run: npm run docs:check
      - name: Install site
        working-directory: apps/site
        run: npm ci
      - name: Test site helpers
        working-directory: apps/site
        run: npm test
      - name: Build site
        working-directory: apps/site
        run: npm run build
      - name: Set up Chromium browser smoke tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser automation
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install chromium --with-deps
      - name: Verify mobile, locales, docs search and Playground
        working-directory: apps/site
        run: |
          mkdir -p .smoke-public
          ln -s ../out .smoke-public/StructMark
          python -m http.server 8765 --directory .smoke-public > /tmp/structmark-smoke.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          sleep 2
          python scripts/browser_smoke.py --base-url http://127.0.0.1:8765/StructMark/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
