name: Language core CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install --disable-pip-version-check tiktoken
      - run: npm run check:v2
      - run: node scripts/validate-vscode-assets.mjs
      - run: npm test
      - run: npm run docs:check
      - run: npm run fuzz
      - run: npm run benchmark:perf
      - run: python benchmark/tokens.py --require-tokenizer
      - run: npm run benchmark:semantic
      - run: python benchmark/v2_compare.py --require-tokenizer

  compatibility:
    name: Core (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        node: ['22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check:v2
      - run: node scripts/validate-vscode-assets.mjs
      - run: npm test
      - run: npm run docs:check
